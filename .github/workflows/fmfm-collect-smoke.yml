name: FMFM real-data smoke collection

on:
  workflow_dispatch:
    inputs:
      coin:
        description: "Hyperliquid coin"
        required: true
        default: "BTC"
        type: string
      live_minutes:
        description: "WebSocket capture duration (minutes; keep short for smoke tests)"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fmfm/pyproject.toml

      - name: Install FMFM
        working-directory: fmfm
        run: python -m pip install -e ".[dev]"

      - name: Collect public market data
        working-directory: fmfm
        env:
          COIN: ${{ inputs.coin }}
          LIVE_MINUTES: ${{ inputs.live_minutes }}
        run: |
          python scripts/collect_local.py \
            --coin "$COIN" \
            --candle-days 1 \
            --funding-days 7 \
            --live-minutes "$LIVE_MINUTES"

      - name: Upload collection files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmfm-collection-${{ inputs.coin }}-${{ github.run_id }}
          path: |
            fmfm/data/collection_runs/
          if-no-files-found: warn
          retention-days: 14
