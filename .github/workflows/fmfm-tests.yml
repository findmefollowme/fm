name: FMFM tests

on:
  push:
    paths:
      - "fmfm/**"
      - ".github/workflows/fmfm-tests.yml"
  pull_request:
    paths:
      - "fmfm/**"
      - ".github/workflows/fmfm-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: fmfm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fmfm/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
